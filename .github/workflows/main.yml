name: EPG-Multi-Source-Grabber

on:
  schedule:
    - cron: '5 0 * * *' # 3:05 rano czasu PL
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja zależności
        run: pip install requests lxml beautifulsoup4 tzdata

      - name: Uruchomienie grabbera w trybie AUTO
        run: python epg_merger.py --auto

      - name: Publikacja plików w GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Aktualne EPG"
          files: Output/*.gz
